[project]
name = "anvaya-backend"
version = "1.0.0"
description = "Anvaya — Visual API Builder, Django + DRF backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "django-ratelimit>=4.1",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.30",
    "Jinja2>=3.1",
    "pydantic>=2.7",
    "structlog>=24.4",
    "sentry-sdk[django]>=2.14",
    "httpx>=0.27",
    "redis>=5.0",
    "dj-stripe>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["apps*", "anvaya*"] } }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "anvaya.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]
