# ╔════════════════════════════════════════════════════════════════════╗
# ║  ⚠  STOP — DO NOT EDIT THIS FILE TO ADD YOUR SECRET VALUES.        ║
# ║                                                                    ║
# ║  This file lists ONLY the NAMES of environment variables that      ║
# ║  Anvaya needs (e.g. DATABASE_URL). The actual VALUES (passwords,   ║
# ║  connection strings, API keys) go into the Render web dashboard:   ║
# ║                                                                    ║
# ║    Render Dashboard → your service → Environment → Add Variable    ║
# ║                                                                    ║
# ║  Pasting secret values into this file commits them to git, which   ║
# ║  exposes them publicly. If you've done that, rotate the secret     ║
# ║  immediately at the provider, then DO NOT re-paste here.           ║
# ╚════════════════════════════════════════════════════════════════════╝
#
# Render Blueprint for Anvaya backend.
#
# Setup:
#   1. Sign up at https://render.com (free tier, no CC required).
#   2. Dashboard → New + → Blueprint → connect this repo.
#   3. Render reads this file and asks you to fill in empty-value variables
#      in the dashboard form. Paste values there, not here.
#
# Provider links:
#   - Neon Postgres:  https://neon.tech            (free 512MB)
#   - Upstash Redis:  https://upstash.com          (free 256MB)
#   - Resend email:   https://resend.com/api-keys  (free 100/day)

services:
  - type: web
    name: anvaya-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    # Free tier doesn't allow `preDeployCommand`. Migrations run via the
    # container's entrypoint.sh script (which then exec's gunicorn). Don't
    # set dockerCommand here — it would override the ENTRYPOINT and we'd
    # lose the migrate step.

    envVars:
      # ── Static values (safe to commit) ────────────────────────────────
      - key: DJANGO_SETTINGS_MODULE
        value: anvaya.settings.prod
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"

      # ── Auto-generated by Render (rotate via dashboard if needed) ────
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # ── Variables Render will prompt for in the dashboard ────────────
      # `sync: false` tells Render: "value lives in the dashboard, not here."
      # DO NOT add `value: <something>` lines below. Use the dashboard UI.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: DJSTRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
