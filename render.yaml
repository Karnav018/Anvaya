# Render Blueprint for Anvaya backend.
#
# Setup:
#   1. Sign up at https://render.com (free, no CC required for the Free tier).
#   2. Connect your GitLab (or GitHub) account.
#   3. New → Blueprint → point at this repo. Render auto-detects this file.
#   4. Provide secrets via the dashboard or `Sync env vars` from a .env upload.
#
# Database: Neon (https://neon.tech) — free 512MB, no expiration. Paste the
#   connection string into DATABASE_URL. Use `?sslmode=require`.
#
# Redis: Upstash (https://upstash.com) — free 256MB, 10k commands/day. Paste
#   the `rediss://` URL into REDIS_URL.
#
# Custom domain: dashboard → Service → Settings → Custom Domains.
#   Point a CNAME at the `<service-name>.onrender.com` host.

services:
  - type: web
    name: anvaya-backend
    runtime: docker
    # repo + branch are inferred from the Render OAuth connection at Blueprint
    # creation time. Don't pin them here — keeps the YAML portable across
    # GitHub / GitLab migrations.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                                       # spins down after 15min idle
    region: oregon                                   # change to your closest region
    healthCheckPath: /health
    autoDeploy: true                                 # deploy on push to `main`

    # Run migrations before each release.
    preDeployCommand: python manage.py migrate --noinput

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: anvaya.settings.prod
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"

      # Generated by Render (rotate via dashboard if needed).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # Required — fill in via dashboard after Neon + Upstash + Resend signup.
      - key: postgresql://neondb_owner:npg_VS8tFBoAyi5b@ep-weathered-resonance-aj3z5a07-pooler.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        sync: false
      - key: rediss://default:gQAAAAAAAhr_AAIgcDJjOTk1MDllZTQ2OGQ0Yjc3YjZjYmIwMjlhZjgyMTI1Ng@wealthy-fowl-137983.upstash.io:6379
        sync: false
      - key: https://anvaya.vercel.app
        sync: false
      - key: https://anvaya.vercel.app
        sync: false
      - key:  https://anvaya-backend.onrender.com
        sync: false
      - key: anvaya-backend.onrender.com,.onrender.com
        sync: false

      # Optional — leave empty until you wire each service.
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: DJSTRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
