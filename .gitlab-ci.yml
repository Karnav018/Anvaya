# Anvaya CI — lint, test, build, deploy.
# Pinned images, cached deps, minimal jobs.

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

# ---------- lint --------------------------------------------------------------

backend:lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -e "./backend[dev]"
  script:
    - ruff check backend/

frontend:lint:
  stage: lint
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  script:
    - npm run lint
    - npx tsc --noEmit

# ---------- test --------------------------------------------------------------

backend:test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: anvaya
    POSTGRES_PASSWORD: anvaya
    POSTGRES_DB: anvaya
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgres://anvaya:anvaya@postgres:5432/anvaya"
    DJANGO_SECRET_KEY: "ci-test-secret-32-chars-padding-pad-pad"
    JWT_SIGNING_KEY: "ci-test-jwt-key-32-chars-padding-pad-pad"
    DJANGO_SETTINGS_MODULE: "anvaya.settings.dev"
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libpq-dev build-essential
    - pip install --upgrade pip
    - pip install -e "./backend[dev]"
  script:
    # Exit 5 = "no tests collected" — treat as success until suite exists.
    - cd backend && (python -m pytest --no-header -q; status=$?; [ $status -eq 0 ] || [ $status -eq 5 ])

frontend:test:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  script:
    # No `test` script defined in package.json yet — skip cleanly when absent.
    - |
      if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
        npm test -- --run
      else
        echo "No frontend test script defined yet — skipping."
      fi

# ---------- build -------------------------------------------------------------

.docker_build_template: &docker_build
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH'

backend:build:
  <<: *docker_build
  script:
    - docker build -t anvaya-backend:$CI_COMMIT_SHA ./backend

frontend:build:
  <<: *docker_build
  script:
    - docker build -t anvaya-frontend:$CI_COMMIT_SHA ./frontend

# ---------- deploy ------------------------------------------------------------

deploy:production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "TODO: implement deploy"
